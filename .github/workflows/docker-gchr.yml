name: Build and Push to GHCR and Deploy to FAT (on PR Merge)

on:
  pull_request:
    types: [closed]
    branches:
      - staging-main

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - id: set-matrix
        run: |
          SERVICES=("auth-service" "chat-service" "contact-service" "meeting-service" \
                    "user-service" "notification-service" "control-service" "signaling-service" "signal-service")

          CHANGED_SERVICES=()
          for service in "${SERVICES[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep "^$service/" > /dev/null; then
              CHANGED_SERVICES+=("\"$service\"")
            fi
          done

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "No services changed."
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            IFS=,
            MATRIX_JSON="{\"service\":[${CHANGED_SERVICES[*]// /,}]}"
            unset IFS
            echo "Changed services matrix: $MATRIX_JSON"
            echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    if: ${{ needs.detect-changes.outputs.matrix != '{"service":[]}' }}
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: sonaialgoframe
          password: ${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}

      - name: Create settings.xml
        run: |
          cat > ${{ github.workspace }}/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>sonaialgoframe</username>
                <password>${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}</password>
              </server>
              <server>
                <id>github-mtc</id>
                <username>sonaialgoframe</username>
                <password>${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}</password>
              </server>
              <server>
                <id>github-notify</id>
                <username>sonaialgoframe</username>
                <password>${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build ${{ matrix.service }} with Maven
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests -s ${{ github.workspace }}/settings.xml

      - name: Build and push Docker image
        id: docker_build
        run: |
          IMAGE=ghcr.io/algoframe-private-limited/${{ matrix.service }}
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "▶ Building and pushing $IMAGE:$COMMIT_SHA"

          docker buildx build --platform linux/amd64,linux/arm64 -t $IMAGE:$COMMIT_SHA -t $IMAGE:latest ./${{ matrix.service }} --push

  trigger-deployment:
    if: needs.detect-changes.outputs.matrix != '{"service":[]}'
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    steps:
      - name: Trigger deployment in FAT
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}
          repository: Algoframe-Private-Limited/k8-deployment-config
          event-type: deploy-latest-image
          client-payload: |
            {
              "environment": "FAT",
              "commit_sha": "${{ needs.build-and-push.outputs.commit_sha }}",
              "changed_services": ${{ toJson(fromJSON(needs.detect-changes.outputs.matrix).service) }}
            }
