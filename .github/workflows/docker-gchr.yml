name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ["auth-service", "chat-service", "contact-service", "meeting-service", "user-service"]
    outputs:
      auth-service-changed: ${{ steps.set-output-auth.outputs.changed }}
      chat-service-changed: ${{ steps.set-output-chat.outputs.changed }}
      contact-service-changed: ${{ steps.set-output-contact.outputs.changed }}
      meeting-service-changed: ${{ steps.set-output-meeting.outputs.changed }}
      user-service-changed: ${{ steps.set-output-user.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if ${{ matrix.service }} has changes
        id: check_changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "^${{ matrix.service }}/" || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.service }} with Maven
        if: steps.check_changes.outputs.changed == 'true'
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Build and push Docker image
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          IMAGE=ghcr.io/algoframe-private-limited/${{ matrix.service }}
          COMMIT_SHA=$(git rev-parse --short HEAD)

          docker build -t $IMAGE:$COMMIT_SHA -t $IMAGE:latest ./${{ matrix.service }}
          docker push $IMAGE:$COMMIT_SHA
          docker push $IMAGE:latest



      # Set output per service so the deployment job can access it
      - name: Set output for auth-service
        id: set-output-auth
        if: matrix.service == 'auth-service'
        run: echo "changed=${{ env.changed }}" >> $GITHUB_OUTPUT

      - name: Set output for chat-service
        id: set-output-chat
        if: matrix.service == 'chat-service'
        run: echo "changed=${{ env.changed }}" >> $GITHUB_OUTPUT

      - name: Set output for contact-service
        id: set-output-contact
        if: matrix.service == 'contact-service'
        run: echo "changed=${{ env.changed }}" >> $GITHUB_OUTPUT

      - name: Set output for meeting-service
        id: set-output-meeting
        if: matrix.service == 'meeting-service'
        run: echo "changed=${{ env.changed }}" >> $GITHUB_OUTPUT

      - name: Set output for user-service
        id: set-output-user
        if: matrix.service == 'user-service'
        run: echo "changed=${{ env.changed }}" >> $GITHUB_OUTPUT
  trigger-deployment:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      needs.build-and-push.outputs.service-auth-service-changed == 'true' ||
      needs.build-and-push.outputs.service-chat-service-changed == 'true' ||
      needs.build-and-push.outputs.service-contact-service-changed == 'true' ||
      needs.build-and-push.outputs.service-meeting-service-changed == 'true' ||
      needs.build-and-push.outputs.service-user-service-changed == 'true'
    steps:
      - name: Trigger deployment in FAT(k8-deployment-config)
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Algoframe-Private-Limited/k8-deployment-config
          event-type: deploy-latest-image
