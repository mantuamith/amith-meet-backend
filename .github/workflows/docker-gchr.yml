name: Build and Push to GHCR

on:
  push:
    branches:
      - master
      - feature/test-ghcr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ["auth-service", "chat-service", "contact-service", "meeting-service", "user-service"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if ${{ matrix.service }} has changes
        id: check_changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep "^${{ matrix.service }}/" || true)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.service }} with Maven
        if: steps.check_changes.outputs.changed == 'true'
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Build and push Docker image
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          IMAGE=ghcr.io/algoframe-private-limited/${{ matrix.service }}
          COMMIT_SHA=$(git rev-parse --short HEAD)

          docker build -t $IMAGE:$COMMIT_SHA -t $IMAGE:latest ./${{ matrix.service }}
          docker push $IMAGE:$COMMIT_SHA
          docker push $IMAGE:latest
