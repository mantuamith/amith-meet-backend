name: Build and Push to GHCR (Manual)

on:
  workflow_dispatch:
    inputs:
      auth-service:
        description: 'Build auth-service?'
        required: true
        default: 'true'
        type: boolean
      chat-service:
        description: 'Build chat-service?'
        required: true
        default: 'true'
        type: boolean
      contact-service:
        description: 'Build contact-service?'
        required: true
        default: 'true'
        type: boolean
      meeting-service:
        description: 'Build meeting-service?'
        required: true
        default: 'true'
        type: boolean
      user-service:
        description: 'Build user-service?'
        required: true
        default: 'true'
        type: boolean
      notification-service:
        description: 'Build notification-service?'
        required: true
        default: 'true'
        type: boolean
      control-service:
        description: 'Build control-service?'
        required: true
        default: 'true'
        type: boolean
      subscription-service:
        description: 'Build Subscription-service?'
        required: true
        default: 'true'
        type: boolean
      signal-service:
        description: 'Build signal-service?'
        required: true
        default: 'true'
        type: boolean
      group-service:
        description: 'Build group-service?'
        required: true
        default: 'true'
        type: boolean
      extra-tag:
        description: 'Additional tag (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      matrix-services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Set matrix based on inputs
        id: set-matrix
        run: |
          SERVICES=()
          if [ "${{ github.event.inputs.auth-service }}" == "true" ]; then SERVICES+=("\"auth-service\""); fi
          if [ "${{ github.event.inputs.chat-service }}" == "true" ]; then SERVICES+=("\"chat-service\"" "\"xmpp-chat-service\""); fi
          if [ "${{ github.event.inputs.contact-service }}" == "true" ]; then SERVICES+=("\"contact-service\""); fi
          if [ "${{ github.event.inputs.meeting-service }}" == "true" ]; then SERVICES+=("\"meeting-service\""); fi
          if [ "${{ github.event.inputs.user-service }}" == "true" ]; then SERVICES+=("\"user-service\""); fi
          if [ "${{ github.event.inputs.notification-service }}" == "true" ]; then SERVICES+=("\"notification-service\""); fi
          if [ "${{ github.event.inputs.control-service }}" == "true" ]; then SERVICES+=("\"control-service\""); fi
          if [ "${{ github.event.inputs.subscription-service }}" == "true" ]; then SERVICES+=("\"subscription-service\""); fi
          if [ "${{ github.event.inputs.signal-service }}" == "true" ]; then SERVICES+=("\"signal-service\""); fi
          if [ "${{ github.event.inputs.group-service }}" == "true" ]; then SERVICES+=("\"group-service\""); fi
          
          # join with commas, not spaces
          SERVICES_JOINED=$(IFS=, ; echo "${SERVICES[*]}")
          MATRIX_JSON="{\"service\":[${SERVICES_JOINED}]}"
          
          echo "MATRIX_JSON=$MATRIX_JSON"
          echo "services=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-services:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.build-and-push.outputs.matrix-services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: sonaialgoframe
          password: ${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}

      - name: Replace Maven token in settings.xml
        run: |
          sed -i "s/SONAI_PACKAGE_REGISTRY_TOKEN/${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}/g" ${{ github.workspace }}/settings.xml

      - name: Build ${{ matrix.service }} with Maven
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests -s ${{ github.workspace }}/settings.xml

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/algoframe-private-limited/${{ matrix.service }}
          COMMIT_SHA=$(git rev-parse --short HEAD)
          EXTRA_TAG="${{ github.event.inputs.extra-tag }}"

          TAG_ARGS="-t $IMAGE:$COMMIT_SHA -t $IMAGE:latest"

          if [ -n "$EXTRA_TAG" ]; then
            TAG_ARGS="$TAG_ARGS -t $IMAGE:$EXTRA_TAG"
          fi

          docker buildx build --platform linux/amd64,linux/arm64 \
            $TAG_ARGS \
            ./${{ matrix.service }} --push
