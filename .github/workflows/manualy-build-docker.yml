name: Build and Push Backend Services (Manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA tag for the image (leave empty to fallback to latest)"
        required: false
        default: ""
      services:
        description: "Which backend service(s) to build?"
        required: true
        type: choice
        options:
          - all
          - auth-service
          - chat-service
          - contact-service
          - meeting-service
          - user-service
          - notification-service
        default: all

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Image Tag
        id: tag
        run: |
          if [ -z "${{ github.event.inputs.commit_sha }}" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.commit_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine Target Services
        id: targets
        run: |
          if [ "${{ github.event.inputs.services }}" = "all" ]; then
            TARGETS="auth-service chat-service contact-service meeting-service user-service notification-service"
          else
            TARGETS="${{ github.event.inputs.services }}"
          fi
          echo "TARGET_SERVICES=$TARGETS" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: sonaialgoframe
          server-password: ${{ secrets.SONAI_PACKAGE_REGISTRY_TOKEN }}

      - name: Create settings.xml
        run: |
          cat > $GITHUB_WORKSPACE/settings.xml <<EOF
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                <server>
                  <id>github</id>
                  <username>sonaialgoframe</username>
                  <password>${{ secrets.SONAI_PACKAGE_REGISTRTY_TOKEN }}</password>
                </server>
              </servers>
            </settings>
            EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.SONAI_PACKAGE_REGISTRTY_TOKEN }}

      - name: Build and Push Services
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for svc in $TARGET_SERVICES; do
            echo "▶ Building and pushing $svc with tag $TAG"

            # Maven build
            cd $svc
            mvn -B package --file pom.xml -DskipTests -s $GITHUB_WORKSPACE/settings.xml
            cd ..

            # Docker build & push
            IMAGE="ghcr.io/algoframe-private-limited/$svc:$TAG"
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t $IMAGE \
              -t ghcr.io/algoframe-private-limited/$svc:latest \
              ./$svc --push

