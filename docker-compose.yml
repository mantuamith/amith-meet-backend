version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
  coturn:
    image: instrumentisto/coturn
    container_name: coturn
    environment:
      - TURN_SECRET=your_turn_secret
      - REALM=your_realm
    ports:
      - "3478:3478"
      - "3478:3478/udp"