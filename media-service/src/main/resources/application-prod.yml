---
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: media-service

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 350MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true

    redis:
      host: redis-svc
      port: 6379
      password: ${REDIS_PASSWORD}

  jackson:
    serialization:
      INDENT_OUTPUT: false

storage:
  active-upload-storage: ${STORAGE_ACTIVE_UPLOAD_STORAGE:local}
  unshared-file-expiration-hours: 1

  local:
    dir: ${STORAGE_LOCAL_DIR:/tmp/media/}

  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-2}
    bucket: ${AWS_S3_BUCKET:algomeet-demo}
    path-style-access: false
    sig-expiration-in-minutes: 15

  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    endpoint: ${OSS_ENDPOINT:https://oss-ap-southeast-6.aliyuncs.com}
    bucket: ${OSS_BUCKET:algomeet-demo}
    sig-expiration-in-minutes: 15

media:
  base-url: ${MEDIA_BASE_URL:https://fat-api.algomeet.app}
  file:
    image-extensions: [jpg, jpeg, png, webp, gif, bmp, tiff, tif, heic, heif, svg, ico]
    video-extensions: [mp4, m4v, mkv, webm, avi, mov, wmv, flv, f4v, mpeg, mpg, 3gp, 3g2, ogv]
    audio-extensions: [mp3, wav, m4a, aac, ogg, opus, flac, amr, wma, aiff, aif, au]
    document-extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, txt, rtf, csv, odt, ods, odp, epub, md, zip, rar, 7z, tar, gz, tgz, bz2, tbz, xz, txz, lz, lzma, zst]

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8095

feign:
  client:
    group-service:
      url: ${GROUP_SERVICE_URL:http://localhost:8087}
