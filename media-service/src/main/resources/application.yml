spring:
  profiles:
    active: local

---

spring:
  application: 
    name: media-service
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 350MB
      
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/clorameet_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
       
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://admin:yoursecurepassword@localhost:27017/chatdb?authSource=admin
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

  jackson:
    serialization:
      INDENT_OUTPUT: true

storage:
  active-upload-storage: local
  unshared-file-expiration-hours: 1
  
  local: 
    dir: /tmp/media/

  s3:
    access-key: AKIA4MF4XOWJ6C7GUQVV2
    secret-key: AlOYvi6eicmZKIWg1afdZagNkKKbIKD7LGoqN0Mo
    region: ap-southeast-2
    bucket: algomeet-demo
    path-style-access: false
    sig-expiration-in-minutes: 1
  
  oss:
    access-key-id: LTAXI5tHZ6boW8n832Q6PWS2S
    access-key-secret: 54IjrqeluGXxA3G2sVRw5ooljeiowk
    endpoint: https://oss-ap-southeast-6.aliyuncs.com
    bucket: algomeet-demo
    sig-expiration-in-minutes: 1

media:
  base-url: http://localhost:8095
  file:
    image-extensions: [jpg, jpeg, png, webp, gif, bmp, tiff, tif, heic, heif, svg, ico]
    video-extensions: [mp4, m4v, mkv, webm, avi, mov, wmv, flv, f4v, mpeg, mpg, 3gp, 3g2, ogv]
    audio-extensions: [mp3, wav, m4a, aac, ogg, opus, flac, amr, wma, aiff, aif, au]
    document-extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, txt, rtf, csv, odt, ods, odp, epub, md, zip, rar, 7z, tar, gz, tgz, bz2, tbz, xz, txz, lz, lzma, zst]
    # Per-type size limits (bytes) — aligned with product requirements
    max-image-size: 20971520       # 20 MB
    max-video-size: 209715200      # 200 MB
    max-audio-size: 52428800       # 50 MB
    max-document-size: 104857600   # 100 MB

server:
  port: 8095

jwt:
  secret: ${JWT_SECRET:Y0h4TkFxWkd6Um9TTktOVlFobU9naFN3SzY5cWhVY08=}

