spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: redis-svc
      port: 6379
      password: ${REDIS_PASSWORD}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # use 'validate' or 'none' in prod
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: mantu.amith@example.com
    password: 55Archuansh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


server:
  port: 8085

jwt:
  secret: ${SPRING_JWT_SECRET}

meeting:
  expiration:
    minutes: 1440

logging:
  level:
    root: INFO
    com.algomeet.meetservice.controller: ${MEETING_LOG_LEVEL}
    com.algomeet.meetservice.service: ${MEETING_LOG_LEVEL}

algomeet:
  jwt:
    app-id: algomeet               # -> aud
    issuer: algomeet               # -> iss
    sub: meet.algoframe.in         # -> sub (your Algomeet)
    secret-base64: ${ALGOMEET_JWT_SECRET_BASE64}
    ttl-seconds: 300
  idgen:
    timezone: UTC          # default; can set to Asia/Kolkata, etc.
    key-prefix: "meet:id:seq:"
    ttl-days: 10
  links:
    base: ${SPRING_MEETING_BASE_URL}
  cleanupScheduler:
    enabled: true

feign:
  client:
    control-service:
      url: http://control-service:8090
    user-service:
      url: http://user-service:8082
