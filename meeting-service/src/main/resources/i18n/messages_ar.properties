#Meeting
unauthorized = رمز غير مصرح به أو غير صالح أو اجتماع غير متاح
internal-error = خطأ غير متوقع أثناء جلب الاجتماع
join-token.required = مطلوب رمز الانضمام.

meeting.join.success = يمكنك الانضمام الآن.
meeting.not-started-yet = لم يبدأ المضيف الاجتماع بعد.
meeting.completed = انتهى هذا الاجتماع.
meeting.expired = لقد انتهت صلاحية رابط الاجتماع هذا.
meeting.fetch.success = تم جلب الاجتماع.

meeting.update.mark-completed = تم وضع علامة على الاجتماع كمكتمل
meeting.update.not-allowed = غير مسموح به أو لم يتم العثور على الاجتماع

meeting.participant.approved = تمت الموافقة على المشارك
meeting.participant.approve.not-allowed = غير مسموح به أو غير صالح

meeting.participant.reject = تم رفض المشارك
meeting.participant.reject.not-allowed = غير مسموح به أو غير صالح

meeting.update.success = تم تحديث الاجتماع
meeting.update.unexpected-error =  خطأ غير متوقع أثناء تحديث الاجتماع

meeting.delete.success = تم حذف الاجتماع
meeting.delete.unexpected-error = خطأ غير متوقع أثناء حذف الاجتماع