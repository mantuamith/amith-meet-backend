#Meeting
unauthorized = ไม่ได้รับอนุญาต โทเค็นไม่ถูกต้อง หรือการประชุมไม่พร้อมใช้งาน
internal-error = ข้อผิดพลาดที่ไม่คาดคิดขณะดึงข้อมูลการประชุม
join-token.required = ต้องใช้โทเค็นการเข้าร่วม

meet.join.success = คุณสามารถเข้าร่วมได้แล้ว
meet.not-started-yet = โฮสต์ยังไม่ได้เริ่มการประชุม
meet.completed = การประชุมนี้สิ้นสุดแล้ว
meet.expired = ลิงก์การประชุมนี้หมดอายุแล้ว
meet.fetch.success = ดึงข้อมูลการประชุมแล้ว

meeting.update.mark-completed = การประชุมถูกทำเครื่องหมายว่าเสร็จสิ้นแล้ว
meeting.update.not-allowed = ไม่อนุญาตหรือไม่พบการประชุม

meeting.participant.approved = ผู้เข้าร่วมได้รับการอนุมัติ
meeting.participant.approve.not-allowed = ไม่อนุญาตหรือไม่ถูกต้อง

meeting.participant.reject = ผู้เข้าร่วมถูกปฏิเสธ
meeting.participant.reject.not-allowed = ไม่อนุญาตหรือไม่ถูกต้อง

meeting.update.success = อัปเดตการประชุมแล้ว
meeting.update.unexpected-error = ข้อผิดพลาดที่ไม่คาดคิดขณะอัปเดตการประชุม

meeting.delete.success = ลบการประชุมแล้ว
meeting.delete.unexpected-error = ข้อผิดพลาดที่ไม่คาดคิดขณะลบการประชุม