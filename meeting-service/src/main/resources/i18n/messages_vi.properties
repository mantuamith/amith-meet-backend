#Meeting
authorized = Mã thông báo không được ủy quyền, không hợp lệ hoặc cuộc họp không khả dụng
internal-error = Lỗi không mong muốn khi tải cuộc họp
join-token.required = Cần có mã thông báo tham gia.

meet.join.success = Bạn có thể tham gia ngay bây giờ.
meet.not-started-yet = Người chủ trì cuộc họp vẫn chưa bắt đầu.
meet.completed = Cuộc họp này đã kết thúc.
meet.expired = Liên kết cuộc họp này đã hết hạn.
meet.fetch.success = Đã tải cuộc họp.

meeting.update.mark-completed = Cuộc họp được đánh dấu là đã hoàn tất
meeting.update.not-allowed = Không được phép hoặc không tìm thấy cuộc họp

meeting.participant.approved = Người tham gia đã được chấp thuận
meeting.participant.approve.not-allowed = Không được phép hoặc không hợp lệ

meeting.participant.reject = Người tham gia bị từ chối
meeting.participant.reject.not-allowed = Không được phép hoặc không hợp lệ

meeting.update.success = Cuộc họp đã được cập nhật
meeting.update.unexpected-error = Lỗi không mong muốn khi cập nhật cuộc họp

meeting.delete.success = Cuộc họp đã bị xóa
meeting.delete.unexpected-error = Lỗi không mong muốn khi xóa cuộc họp