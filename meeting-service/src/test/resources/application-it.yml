spring:
  cloud:
    openfeign:
      enabled: false
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:itdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      repositories:
        enabled: false

  mvc:
    problemdetails:
      enabled: true


