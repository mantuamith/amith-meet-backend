spring:
  profiles:
    active: local

---

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/clorameet_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
       
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://admin:yoursecurepassword@localhost:27017/chatdb?authSource=admin
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      INDENT_OUTPUT: true

server:
  port: 8093

jwt:
  secret: Y0h4TkFxWkd6Um9TTktOVlFobU9naFN3SzY5cWhVY08=
