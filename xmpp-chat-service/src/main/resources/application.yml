spring:
  profiles:
    active: local

---
spring:
  application: 
    name: xmpp-chat-service
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/clorameet_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: mongodb://admin:yoursecurepassword@localhost:27017/chatdb?authSource=admin
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      INDENT_OUTPUT: true

server:
  port: 8097

xmpp:
  server:
    port: 8098
    domain: algomeet.app
    group-chat-domain: conference.algomeet.app

jwt:
  secret: Y0h4TkFxWkd6Um9TTktOVlFobU9naFN3SzY5cWhVY08=

feign:
  client:
    group-service:
      url: http://localhost:8087
    media-service:
      url: http://localhost:8095
